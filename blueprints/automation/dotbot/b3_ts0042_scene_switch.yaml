blueprint:
  name: B3 – Zigbee2MQTT TS0042 (2-Button) Scene Switch
  description: >
    Mapping für Tuya TS0042 (2-Button Scene Switch) via Zigbee2MQTT.
    Unterstützte Aktionen: 1_single, 1_double, 1_hold, 2_single, 2_double, 2_hold.
  domain: automation
  input:
    switch_device:
      name: TS0042 Device (MQTT)
      description: Wähle das TS0042 Device aus (Zigbee2MQTT über MQTT Integration).
      selector:
        device:
          integration: mqtt

    button_1_single:
      name: Button 1 – Single
      default: []
      selector:
        action: {}

    button_1_double:
      name: Button 1 – Double
      default: []
      selector:
        action: {}

    button_1_hold:
      name: Button 1 – Hold
      default: []
      selector:
        action: {}

    button_2_single:
      name: Button 2 – Single
      default: []
      selector:
        action: {}

    button_2_double:
      name: Button 2 – Double
      default: []
      selector:
        action: {}

    button_2_hold:
      name: Button 2 – Hold
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

trigger:
  - platform: device
    domain: mqtt
    device_id: !input switch_device
    type: action
    subtype: 1_single
    id: b1_single

  - platform: device
    domain: mqtt
    device_id: !input switch_device
    type: action
    subtype: 1_double
    id: b1_double

  - platform: device
    domain: mqtt
    device_id: !input switch_device
    type: action
    subtype: 1_hold
    id: b1_hold

  - platform: device
    domain: mqtt
    device_id: !input switch_device
    type: action
    subtype: 2_single
    id: b2_single

  - platform: device
    domain: mqtt
    device_id: !input switch_device
    type: action
    subtype: 2_double
    id: b2_double

  - platform: device
    domain: mqtt
    device_id: !input switch_device
    type: action
    subtype: 2_hold
    id: b2_hold

action:
  - choose:
      - conditions:
          - condition: trigger
            id: b1_single
        sequence: !input button_1_single

      - conditions:
          - condition: trigger
            id: b1_double
        sequence: !input button_1_double

      - conditions:
          - condition: trigger
            id: b1_hold
        sequence: !input button_1_hold

      - conditions:
          - condition: trigger
            id: b2_single
        sequence: !input button_2_single

      - conditions:
          - condition: trigger
            id: b2_double
        sequence: !input button_2_double

      - conditions:
          - condition: trigger
            id: b2_hold
        sequence: !input button_2_hold
